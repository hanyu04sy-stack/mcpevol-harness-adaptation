name: Lightweight validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out tracked files only
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # Only the small JSON Schema validator is installed. There is deliberately
      # no benchmark dependency, bundle download, 1MCP, Ollama, or benchmark run.
      - name: Install lightweight schema validator
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run complete A handoff gate
        run: python scripts/check_handoff.py

      - name: Verify raw results archive checksum
        working-directory: deliverables
        run: shasum -a 256 -c SHA256SUMS

      - name: Extract raw results archive
        run: tar -xzf deliverables/mcpevol-D-raw-results-2026-10-16.tar.gz

      - name: Audit extracted formal experiment matrix
        run: python scripts/audit_experiment_results.py --output "${RUNNER_TEMP}/final-experiment-audit.json"
